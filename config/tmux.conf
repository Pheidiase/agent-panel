set -g exit-empty off
set -g destroy-unattached off
set -g status off
set -g mouse off
set -g history-limit 5000
set -g default-terminal "tmux-256color"
set -g focus-events on
set -g set-clipboard off
set -g allow-passthrough off
set -g prefix None
unbind-key -a
set -g remain-on-exit on
# Pane geometry belongs to the panel: the web tier never resizes on behalf of a
# viewer and re-asserts the recorded size, so attaching or resizing a browser
# cannot rewrap the lines someone is reading.
set -g window-size latest
